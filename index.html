<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TAP — tie a knot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="art.js"></script>
<style>
:root{--bg:#050508;--neon:#00f0ff;--pink:#ff00e5;--lime:#a6ff00;--dim:#8a8a9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Courier New",monospace;background:var(--bg);color:#e8e8e8;margin:0;padding:0;min-height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 4px)}
header{padding:26px 20px 10px;text-align:center}
h1{font-size:44px;letter-spacing:14px;margin:0;color:#fff;
  text-shadow:3px 0 0 var(--pink),-3px 0 0 var(--neon)}
h1 .dot{color:var(--lime)}
.sub{color:var(--dim);font-size:12px;letter-spacing:3px;margin-top:8px}
#tieBtn{display:block;width:calc(100% - 40px);margin:22px 20px;padding:20px;font-family:inherit;
  font-size:20px;letter-spacing:6px;background:transparent;color:var(--lime);
  border:2px solid var(--lime);border-radius:10px;cursor:pointer;
  box-shadow:0 0 24px rgba(166,255,0,.25),inset 0 0 18px rgba(166,255,0,.08)}
#tieBtn:active{transform:scale(.97);background:rgba(166,255,0,.12)}
#status{text-align:center;color:var(--dim);font-size:12px;min-height:18px;padding:0 20px;white-space:pre-wrap}
h2{font-size:13px;letter-spacing:5px;color:var(--dim);padding:0 20px;margin:26px 0 12px}
h2 b{color:var(--neon)}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 40px}
.card{border:1px solid #222;border-radius:10px;overflow:hidden;background:#0a0a10;cursor:pointer}
.card canvas{width:100%;display:block;aspect-ratio:1}
.card .meta{padding:8px 10px;font-size:10px;color:var(--dim);letter-spacing:1px}
.card .meta b{color:#fff}
.card.revoked{opacity:.45}.card.revoked .meta b{color:var(--pink)}
#detail{position:fixed;inset:0;background:rgba(3,3,6,.96);z-index:50;display:none;
  overflow-y:auto;padding:20px}
#detail.show{display:block}
#detail canvas{width:100%;border-radius:12px;border:1px solid #333}
#detail pre{font-size:11px;color:var(--dim);white-space:pre-wrap;word-break:break-all;
  border:1px solid #222;border-radius:8px;padding:12px}
#detail .row{display:flex;gap:10px;margin:14px 0}
button.ghost{flex:1;font-family:inherit;font-size:14px;letter-spacing:2px;padding:14px;
  background:transparent;border:1px solid #444;color:#ccc;border-radius:8px;cursor:pointer}
button.untie{flex:1;font-family:inherit;font-size:14px;letter-spacing:2px;padding:14px;
  background:transparent;border:1px solid var(--pink);color:var(--pink);border-radius:8px;cursor:pointer;
  box-shadow:0 0 18px rgba(255,0,229,.2)}
#tokenBox{display:none;margin:0 20px 10px;padding:16px;border:1px dashed var(--neon);
  border-radius:10px;text-align:center}
#tokenBox .t{font-size:26px;letter-spacing:4px;color:var(--neon);margin:8px 0}
#tokenBox .hint{font-size:11px;color:var(--dim)}
</style></head><body>
<header><h1>TAP<span class="dot">◉</span></h1><div class="sub">PROOF OF MEETING · EVERY KNOT IS ONE-OF-A-KIND ART</div></header>
<button id="tieBtn">🪢 TIE A KNOT</button>
<div id="tokenBox"><div class="hint">MEETING TOKEN — the other phone redeems it (5 min)</div><div class="t" id="tokenVal"></div><div class="hint" id="tokenHint"></div></div>
<div id="status"></div>
<h2>◉ KNOT <b>COLLECTION</b> <span id="count"></span></h2>
<div id="grid"></div>
<div id="detail"><div id="dBody"></div></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const qs = new URLSearchParams(location.search);
const API = qs.get('api') || '';  // same-origin by default; ?api=https://host for dev
const st = m => document.getElementById('status').textContent = m;
const initData = (tg && tg.initData) || '';
const startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
const BOT = 'Taptapbotbot';

// ---- backend calls ----
async function api(path, body) {
  const r = await fetch(API + path, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({initData, ...body})});
  return r.json();
}

// ---- demo knots (no backend / no telegram): the art shines immediately ----
function demoKnots() {
  const seeds = ['72f320ab423a9b69','5bb273526d4174da','a024dde045c81e85','0d2666135367f56f','e56cfb020c301d15','ba89abd461f18e34'];
  return seeds.map((s,i)=>({id:s, code:(parseInt(s.slice(0,4),16)%9000+1000)+'', userA:111, userB:222,
    timestamp:new Date(Date.now()-i*864e5).toISOString(), revoked:i===5?1:0, demo:true}));
}

let knots = [];
let dAnim = null;  // living detail-view animation handle — stopped on close
function closeDetail(){ if(dAnim){ try{dAnim.stop();}catch(e){} dAnim=null; } document.getElementById('detail').classList.remove('show'); }
async function load() {
  if (!initData || !API && location.protocol.startsWith('http')===false) { knots = demoKnots(); }
  else {
    try { const r = await api('/api/knots'); knots = r.ok ? r.knots.map(k=>({...k.knot, id:k.id, signature:k.signature, revoked:k.revoked})) : demoKnots(); }
    catch(e){ knots = demoKnots(); }
  }
  if (!knots.length && !initData) knots = demoKnots();
  render();
}
function render() {
  const g = document.getElementById('grid'); g.innerHTML='';
  document.getElementById('count').textContent = '· '+knots.length;
  knots.forEach(k=>{
    const d = document.createElement('div'); d.className='card'+(k.revoked?' revoked':'');
    const c = document.createElement('canvas');
    KnotArt.render(c, k.id, {w:360,h:360,code:k.code});
    d.appendChild(c);
    const m = document.createElement('div'); m.className='meta';
    m.innerHTML = `<b>${k.revoked?'✕ CUT':'◉ '+k.id.slice(0,8)}</b><br>${(k.timestamp||'').slice(0,10)}`;
    d.appendChild(m); d.onclick=()=>detail(k); g.appendChild(d);
  });
}
function detail(k){
  const d = document.getElementById('detail'); d.classList.add('show');
  d.querySelector('#dBody').innerHTML = `
    <canvas id="dArt" width="720" height="720"></canvas>
    <div class="row"><button class="ghost" onclick="closeDetail()">← BACK</button>
    ${k.revoked?'':(k.demo?'':'<button class="untie" id="bUntie">✕ CUT THE THREAD</button>')}</div>
    <pre>${JSON.stringify({id:k.id,code:k.code,userA:k.userA,userB:k.userB,timestamp:k.timestamp,band:k.band,signature:(k.signature||'demo').slice(0,48)+'…'},null,1)}</pre>`;
  if(dAnim){ try{dAnim.stop();}catch(e){} dAnim=null; }
  dAnim = KnotArt.renderAnimated(document.getElementById('dArt'), k.id, {w:720,h:720,code:k.code});
  const b = document.getElementById('bUntie');
  if (b) b.onclick = async ()=>{
    if(!confirm('Cut this knot? The other side is notified. This cannot be undone.')) return;
    const r = await api('/api/knots/revoke',{knotId:k.id});
    if(r.ok){ k.revoked=1; render(); detail(k); } else st('revoke failed: '+(r.reason||'?'));
  };
  if (tg) tg.BackButton.show(), tg.BackButton.onClick(()=>d.classList.remove('show'));
}

// ---- tie a knot ----
document.getElementById('tieBtn').onclick = async ()=>{
  if (!initData) { st('demo mode — open inside Telegram to tie real knots'); return; }
  st('issuing meeting token…');
  try {
    const r = await api('/api/meeting/create');
    if (!r.ok) { st(r.userMessage || ('failed: '+(r.reason||'?'))); return; }
    const link = `https://t.me/${BOT}/app?startapp=${r.token}`;
    const box = document.getElementById('tokenBox'); box.style.display='block';
    document.getElementById('tokenVal').textContent = r.token;
    document.getElementById('tokenHint').innerHTML =
      'share this link with the other phone (5 min):<br><b style="color:#fff">'+link+'</b><br><br>' +
      `<button class="ghost" style="width:100%" onclick="navigator.clipboard.writeText('${link}').then(()=>{})">COPY INVITE LINK</button>` +
      `<button class="ghost" style="width:100%;border-color:#a6ff00;color:#a6ff00" onclick="location.href='./ceremony.html?token=${r.token}&role=initiate'">▶ OPEN CEREMONY AS INITIATOR</button>`;
    st('token live for 5 min — send the link, then open the ceremony when they join');
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } catch(e){ st('backend unreachable'); }
};

// ---- joiner deep-link: redeem the token from start_param ----
async function maybeRedeem(){
  if (!initData || !startParam || !/^[A-Za-z0-9_-]{12,}$/.test(startParam)) return;
  st('redeeming invite token…');
  try {
    const r = await api('/api/meeting/redeem', { token: startParam });
    if (!r.ok) { st('invite failed: '+(r.reason||'?')); return; }
    const box = document.getElementById('tokenBox'); box.style.display='block';
    document.getElementById('tokenVal').textContent = '◉ PAIRED';
    document.getElementById('tokenHint').innerHTML =
      `you're paired with user ${r.creator}.<br><br>` +
      `<button class="ghost" style="width:100%;border-color:#a6ff00;color:#a6ff00" onclick="location.href='./ceremony.html?token=${startParam}&role=join'">▶ OPEN CEREMONY AS JOINER</button>`;
    st('paired — open the ceremony and press START');
  } catch(e){ st('backend unreachable'); }
}
load().then(maybeRedeem);
</script>
</body></html>
